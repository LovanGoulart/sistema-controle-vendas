<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Controle de Vendas{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-chart-line"></i>
            <span>Controle Vendas</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item {% if request.path == '/dashboard' %}active{% endif %}">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="/vendas" class="nav-item {% if request.path == '/vendas' %}active{% endif %}">
                <i class="fas fa-shopping-cart"></i>
                <span>Nova Venda</span>
            </a>
            <a href="/clientes" class="nav-item {% if request.path == '/clientes' %}active{% endif %}">
                <i class="fas fa-users"></i>
                <span>Clientes</span>
            </a>
            <a href="/produtos" class="nav-item {% if request.path == '/produtos' %}active{% endif %}">
                <i class="fas fa-box"></i>
                <span>Produtos</span>
            </a>
            <a href="/relatorios" class="nav-item {% if request.path == '/relatorios' %}active{% endif %}">
                <i class="fas fa-chart-bar"></i>
                <span>Relatórios</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="userName">Admin</span>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sair</span>
            </button>
        </div>
    </aside>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <button class="menu-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <span class="mobile-title">Controle de Vendas</span>
        <button class="btn-logout-mobile" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Overlay para mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Loading -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
