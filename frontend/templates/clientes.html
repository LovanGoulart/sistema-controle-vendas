{% extends "base.html" %}
{% block title %}Clientes | Controle de Vendas{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-users"></i> Clientes</h1>
    <button class="btn-primary" onclick="abrirModalCliente()">
        <i class="fas fa-plus"></i> Novo Cliente
    </button>
</div>

<div class="search-bar">
    <i class="fas fa-search"></i>
    <input type="text" id="buscaClientes" placeholder="Buscar por nome, email ou telefone..." 
           oninput="buscarClientes()">
</div>

<div class="table-container">
    <table class="data-table" id="tabelaClientes">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Contato</th>
                <th>Cidade/UF</th>
                <th>Vendas</th>
                <th>Total Gasto</th>
                <th>Lucro Gerado</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabelaClientes">
            <tr><td colspan="7" class="loading-cell">Carregando clientes...</td></tr>
        </tbody>
    </table>
</div>

<!-- Modal Cliente -->
<div id="modalCliente" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="tituloModalCliente"><i class="fas fa-user"></i> Novo Cliente</h3>
            <button class="modal-close" onclick="fecharModalCliente()"><i class="fas fa-times"></i></button>
        </div>
        <form id="formCliente" class="modal-form">
            <input type="hidden" id="clienteId">
            <div class="form-row">
                <div class="form-group">
                    <label>Nome *</label>
                    <input type="text" id="clienteNome" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="clienteEmail">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="clienteTelefone" placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" id="clienteCidade">
                </div>
                <div class="form-group">
                    <label>UF</label>
                    <input type="text" id="clienteEstado" maxlength="2" placeholder="SP">
                </div>
            </div>
            <div class="form-group">
                <label>Endereço</label>
                <input type="text" id="clienteEndereco">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Latitude</label>
                    <input type="number" id="clienteLat" step="any" placeholder="-23.5505">
                </div>
                <div class="form-group">
                    <label>Longitude</label>
                    <input type="number" id="clienteLng" step="any" placeholder="-46.6333">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="fecharModalCliente()">Cancelar</button>
                <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/clientes.js') }}"></script>
{% endblock %}
