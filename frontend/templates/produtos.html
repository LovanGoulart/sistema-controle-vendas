{% extends "base.html" %}
{% block title %}Produtos | Controle de Vendas{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-box"></i> Produtos</h1>
    <button class="btn-primary" onclick="abrirModalProduto()">
        <i class="fas fa-plus"></i> Novo Produto
    </button>
</div>

<div class="filters-bar">
    <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="buscaProdutos" placeholder="Buscar produtos..." oninput="buscarProdutos()">
    </div>
    <select id="filtroCategoria" onchange="buscarProdutos()">
        <option value="">Todas as Categorias</option>
    </select>
</div>

<div class="table-container">
    <table class="data-table" id="tabelaProdutos">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Custo</th>
                <th>Venda</th>
                <th>Lucro Unit.</th>
                <th>Margem</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabelaProdutos">
            <tr><td colspan="8" class="loading-cell">Carregando produtos...</td></tr>
        </tbody>
    </table>
</div>

<!-- Modal Produto -->
<div id="modalProduto" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="tituloModalProduto"><i class="fas fa-box"></i> Novo Produto</h3>
            <button class="modal-close" onclick="fecharModalProduto()"><i class="fas fa-times"></i></button>
        </div>
        <form id="formProduto" class="modal-form">
            <input type="hidden" id="produtoId">
            <div class="form-row">
                <div class="form-group">
                    <label>Nome *</label>
                    <input type="text" id="produtoNome" required>
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <input type="text" id="produtoCategoria" placeholder="Ex: Eletrônicos">
                </div>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="produtoDescricao" rows="2"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Preço de Custo (R$) *</label>
                    <input type="number" id="produtoCusto" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Preço de Venda (R$) *</label>
                    <input type="number" id="produtoVenda" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Estoque Inicial</label>
                    <input type="number" id="produtoEstoque" min="0" value="0">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="fecharModalProduto()">Cancelar</button>
                <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/produtos.js') }}"></script>
{% endblock %}
